<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin - Soi Đề & Nhảy Câu</title>

<link rel="preload" as="image" href="bg.jpg">

<style>
  :root { 
    --bg-color: #f5f5f7; 
    --card-bg: #ffffff; 
    --text-main: #1d1d1f; 
    --text-sub: #86868b; 
    --accent: #007aff; 
    --success: #34c759; 
    --success-bg: #e8f9ec; 
    --danger: #ff3b30; 
    --danger-bg: #ffecec; 
    --border: #e5e5ea; 
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background-color: #d1d1d6; 
    background-image: url('bg.jpg'); 
    background-size: cover; 
    background-position: center; 
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text-main); 
    font-family: -apple-system, BlinkMacSystemFont, "Roboto", sans-serif; 
    line-height: 1.5; 
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }

  /* TOPBAR ĐỒNG BỘ */
  .topbar { 
    position: sticky; 
    top: 0; 
    background: rgba(255, 255, 255, 0.85); 
    backdrop-filter: blur(12px); 
    -webkit-backdrop-filter: blur(12px); 
    border-bottom: 1px solid var(--border); 
    padding: 12px 18px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    z-index: 100; 
    gap: 10px;
  }
  .brand-group { display: flex; align-items: center; gap: 8px; }
  .brand { font-size: 17px; font-weight: 700; }
  .admin-tag { 
    background: var(--accent); 
    color: #fff; 
    font-size: 11px; 
    font-weight: 700; 
    padding: 2px 8px; 
    border-radius: 8px; 
    text-transform: uppercase; 
  }

  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .select-module {
    background: var(--bg-color);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    outline: none;
    max-width: 140px;
  }
  .btn-header { 
    background: var(--bg-color); 
    color: var(--accent); 
    border: none; 
    padding: 7px 14px; 
    border-radius: 12px; 
    font-weight: 600; 
    font-size: 13px; 
    cursor: pointer; 
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .btn-header:active { transform: scale(0.95); }

  /* CONTAINER CHÍNH */
  .container { 
    flex: 1; 
    width: 100%; 
    max-width: 680px; 
    margin: 0 auto; 
    padding: 20px 4% 40px; 
    display: flex; 
    flex-direction: column;
    gap: 16px;
  }

  /* THẺ CARD TRẮNG */
  .card { 
    background: rgba(255, 255, 255, 0.95); 
    border-radius: 24px; 
    padding: 22px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
    width: 100%; 
    box-sizing: border-box; 
  }

  .q-stats { 
    font-size: 13px; 
    font-weight: 700; 
    color: var(--text-sub); 
    text-transform: uppercase; 
    margin-bottom: 12px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
  }
  .q-text { font-size: 19px; font-weight: 600; margin-bottom: 20px; line-height: 1.45; }

  /* CÁC NÚT ĐÁP ÁN */
  .opt-btn { 
    width: 100%; 
    background: var(--bg-color); 
    border: 2px solid transparent; 
    border-radius: 16px; 
    padding: 14px 16px; 
    margin-bottom: 10px; 
    text-align: left; 
    font-size: 15px; 
    font-weight: 500; 
    color: var(--text-main); 
    display: flex; 
    gap: 12px; 
    align-items: flex-start; 
    word-break: break-word; 
  }
  .opt-label { font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: #0e5c22; font-weight: 600; }
  .badge-correct { 
    margin-left: auto; 
    background: var(--success); 
    color: white; 
    font-size: 11px; 
    padding: 2px 8px; 
    border-radius: 6px; 
    font-weight: 700; 
  }

  /* HỘP GIẢI THÍCH */
  .feedback { 
    margin-top: 16px; 
    padding: 14px 16px; 
    border-radius: 14px; 
    font-size: 14px; 
    font-weight: 500; 
    background: var(--success-bg); 
    color: #0e5c22; 
    border-left: 4px solid var(--success);
    line-height: 1.45;
  }

  /* THANH ĐIỀU HƯỚNG CÂU */
  .nav-bar { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-top: 16px;
    gap: 10px;
  }
  .btn-nav {
    flex: 1;
    max-width: 130px;
    padding: 12px;
    border-radius: 14px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    transition: 0.15s;
  }
  .btn-prev { background: var(--bg-color); color: var(--text-main); }
  .btn-next { background: var(--accent); color: white; }
  .btn-nav:disabled { opacity: 0.35; cursor: default; }

  /* BẢNG LƯỚI NHẢY CÂU HỎI */
  .grid-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    color: var(--text-sub);
    text-transform: uppercase;
  }
  .palette-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 4px;
  }
  @media (min-width: 600px) {
    .palette-grid { grid-template-columns: repeat(10, 1fr); max-height: 300px; }
  }
  .palette-btn {
    height: 40px;
    border: 1px solid var(--border);
    background: var(--bg-color);
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-main);
    cursor: pointer;
    transition: 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .palette-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* MODAL ĐĂNG NHẬP NẾU TRUY CẬP TRỰC TIẾP */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .modal-box {
    background: white;
    width: 100%;
    max-width: 350px;
    border-radius: 24px;
    padding: 26px 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }
  .input-field {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }
  .input-field:focus { border-color: var(--accent); }
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .error-msg { color: var(--danger); font-size: 12px; margin-bottom: 10px; display: none; text-align: center; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- THANH ĐIỀU HƯỚNG TRÊN CÙNG -->
<div class="topbar">
  <div class="brand-group">
    <div class="brand">✈️ Training</div>
    <span class="admin-tag" id="userTag">ADMIN</span>
  </div>

  <div class="topbar-actions">
    <select id="moduleSelect" onchange="loadExamData(this.value)" class="select-module">
      <option value="">Đang tải...</option>
    </select>
    <a href="index.html" class="btn-header">Về Quiz</a>
  </div>
</div>

<!-- POPUP ĐĂNG NHẬP (NẾU CHƯA ĐĂNG NHẬP MÀ VÀO TRỰC TIẾP) -->
<div id="authModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 style="font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 4px;">🔐 Đăng Nhập Quản Trị</h3>
    <p style="font-size: 13px; color: var(--text-sub); text-align: center; margin-bottom: 18px;">Vui lòng xác thực tài khoản</p>
    
    <form onsubmit="handleAuth(event)">
      <input type="text" id="authUsername" placeholder="Tên tài khoản" class="input-field" required autocomplete="username" />
      <input type="password" id="authPassword" placeholder="Mật khẩu" class="input-field" required autocomplete="current-password" />
      <div id="authError" class="error-msg">Sai tài khoản hoặc mật khẩu!</div>
      <button type="submit" class="btn-submit">Đăng nhập</button>
      <a href="index.html" style="display: block; text-align: center; font-size: 13px; color: var(--text-sub); margin-top: 12px; text-decoration: none;">← Về trang chủ</a>
    </form>
  </div>
</div>

<!-- KHUNG NỘI DUNG CHÍNH -->
<div class="container">

  <!-- CARD 1: CÂU HỎI & CÁC ĐÁP ÁN -->
  <div class="card">
    <div class="q-stats">
      <span id="statQuestionBadge" style="color: var(--accent);">CÂU HỎI 1 / 0</span>
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; text-transform: none; color: var(--text-main); font-weight: 500;">
        <input type="checkbox" id="toggleAnswer" checked onchange="renderCurrentQuestion()"> Hiện đáp án
      </label>
    </div>

    <div class="q-text" id="questionText">Đang tải dữ liệu câu hỏi...</div>
    <div id="optionsBox"></div>
    <div id="explanationBox" class="feedback hidden"></div>

    <!-- NÚT LẬT CÂU TRƯỚC / SAU -->
    <div class="nav-bar">
      <button onclick="prevQuestion()" id="btnPrev" class="btn-nav btn-prev">‹ Câu trước</button>
      <span id="statQuestionIndex" style="font-size: 13px; font-weight: 600; color: var(--text-sub);">1 / 1</span>
      <button onclick="nextQuestion()" id="btnNext" class="btn-nav btn-next">Câu sau ›</button>
    </div>
  </div>

  <!-- CARD 2: BẢNG LƯỚI NHẢY CÂU (PALETTE) -->
  <div class="card">
    <div class="grid-title">
      <span>Danh Sách Câu Hỏi</span>
      <span id="totalQuestionsCount">0 câu</span>
    </div>
    <div id="paletteGrid" class="palette-grid"></div>
  </div>

</div>

<script>
// DANH SÁCH 2 TÀI KHOẢN ĐƯỢC PHÉP
const VALID_ACCOUNTS = {
  "admin": "admin123",
  "quockiet": "adminquockiet"
};

function checkAccess() {
  if (sessionStorage.getItem("isAdmin") !== "true") {
    document.getElementById("authModal").classList.remove("hidden");
  } else {
    const user = sessionStorage.getItem("adminUser") || "ADMIN";
    document.getElementById("userTag").innerText = user.toUpperCase();
    loadModules();
  }
}

function handleAuth(e) {
  e.preventDefault();
  const u = document.getElementById("authUsername").value.trim();
  const p = document.getElementById("authPassword").value.trim();
  const err = document.getElementById("authError");

  if (VALID_ACCOUNTS[u] && VALID_ACCOUNTS[u] === p) {
    sessionStorage.setItem("isAdmin", "true");
    sessionStorage.setItem("adminUser", u);
    document.getElementById("authModal").classList.add("hidden");
    document.getElementById("userTag").innerText = u.toUpperCase();
    loadModules();
  } else {
    err.style.display = "block";
  }
}

let questions = [];
let currentIndex = 0;

// Tự động load danh sách file từ data/modules.json
async function loadModules() {
  try {
    const res = await fetch('data/modules.json');
    const modules = await res.json();
    const select = document.getElementById('moduleSelect');
    select.innerHTML = '';
    modules.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.file;
      opt.innerText = m.title;
      select.appendChild(opt);
    });
    if (modules.length > 0) {
      loadExamData(modules[0].file);
    }
  } catch (e) {
    console.error("Lỗi modules.json", e);
  }
}

async function loadExamData(fileUrl) {
  if (!fileUrl) return;
  try {
    const res = await fetch(fileUrl);
    questions = await res.json();
    currentIndex = 0;
    document.getElementById("totalQuestionsCount").innerText = `${questions.length} câu`;
    renderPalette();
    renderCurrentQuestion();
  } catch (err) {
    alert("Không thể tải file: " + err.message);
  }
}

// Vẽ lưới số câu (1, 2, 3...)
function renderPalette() {
  const grid = document.getElementById("paletteGrid");
  grid.innerHTML = "";

  questions.forEach((_, idx) => {
    const btn = document.createElement("button");
    btn.innerText = idx + 1;
    btn.className = `palette-btn ${idx === currentIndex ? "active" : ""}`;
    btn.onclick = () => {
      currentIndex = idx;
      renderCurrentQuestion();
    };
    grid.appendChild(btn);
  });
}

// Hiển thị câu hỏi hiện tại
function renderCurrentQuestion() {
  if (!questions.length) return;
  const q = questions[currentIndex];
  const showAnswer = document.getElementById("toggleAnswer").checked;

  const qText = q[1] || "";
  const options = q[2] || [];
  const correctIdx = q[3];
  const explanation = q[4] || "";

  document.getElementById("statQuestionBadge").innerText = `CÂU HỎI ${currentIndex + 1} / ${questions.length}`;
  document.getElementById("statQuestionIndex").innerText = `${currentIndex + 1} / ${questions.length}`;
  document.getElementById("questionText").innerText = qText;

  const optBox = document.getElementById("optionsBox");
  optBox.innerHTML = "";

  options.forEach((optText, i) => {
    const label = ['A', 'B', 'C', 'D'][i];
    const isCorrect = (i === correctIdx);

    const div = document.createElement("div");
    let isHighlight = showAnswer && isCorrect;
    div.className = `opt-btn ${isHighlight ? "correct" : ""}`;

    div.innerHTML = `
      <span class="opt-label">${label}.</span>
      <span style="flex: 1;">${optText}</span>
      ${isHighlight ? `<span class="badge-correct">ĐÚNG</span>` : ""}
    `;
    optBox.appendChild(div);
  });

  // Khung giải thích
  const expBox = document.getElementById("explanationBox");
  if (showAnswer && explanation) {
    expBox.classList.remove("hidden");
    expBox.innerHTML = `<strong>💡 Giải thích:</strong><br><span style="margin-top: 4px; display: block;">${explanation}</span>`;
  } else {
    expBox.classList.add("hidden");
  }

  document.getElementById("btnPrev").disabled = (currentIndex === 0);
  document.getElementById("btnNext").disabled = (currentIndex === questions.length - 1);

  renderPalette();
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCurrentQuestion();
  }
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderCurrentQuestion();
  }
}

// Bắt phím mũi tên lật câu
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextQuestion();
  if (e.key === "ArrowLeft") prevQuestion();
});

checkAccess();
</script>
</body>
</html>
