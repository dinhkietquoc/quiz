<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Internal Training</title>

<!-- Lệnh Tối Ưu: Ưu tiên tải ảnh nền ngay lập tức để tránh đen màn hình -->
<link rel="preload" as="image" href="bg.jpg">

<style>
  :root { 
    --bg-color: #f5f5f7; 
    --card-bg: #ffffff; 
    --text-main: #1d1d1f; 
    --text-sub: #86868b; 
    --accent: #007aff; 
    --success: #34c759; 
    --success-bg: #e8f9ec; 
    --danger: #ff3b30; 
    --danger-bg: #ffecec; 
    --border: #e5e5ea; 
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background-color: #d1d1d6; /* Màu nền dự phòng (fallback) khi ảnh chưa load kịp */
    background-image: url('bg.jpg'); 
    background-size: cover; 
    background-position: center; 
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text-main); 
    font-family: -apple-system, BlinkMacSystemFont, "Roboto", sans-serif; 
    line-height: 1.5; 
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }

  .topbar { position: sticky; top: 0; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
  .brand { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .btn-header { background: var(--bg-color); color: var(--accent); border: none; padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .btn-header:active { transform: scale(0.95); }
  
  .progress-container { width: 100%; height: 4px; background: var(--border); }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

  /* =========================================
     CẤU TRÚC LAYOUT TƯƠNG THÍCH MỌI TRÌNH DUYỆT
     ========================================= */

  .container { 
    flex: 1; 
    width: 100%; 
    max-width: 650px; 
    margin: 0 auto; 
    padding: 30px 5%; 
    box-sizing: border-box; 
    display: flex; 
    flex-direction: column;
    justify-content: flex-start; /* Mặc định menu đẩy lên trên */
    transition: all 0.3s ease;
  }

  /* CLASS CĂN GIỮA TUYỆT ĐỐI (Sẽ được bật bằng JS khi vào Quiz/Loading/End) */
  .container.center-mode {
    justify-content: center;
    align-items: center;
    padding-top: 15px;
    padding-bottom: 15px;
  }

  /* BẢNG TRẮNG CHUNG (Dùng cho Quiz, Loading, EndScreen) */
  .card { 
    background: rgba(255, 255, 255, 0.95); 
    border-radius: 24px; 
    padding: 24px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
    border: none; 
    width: 100%; 
    box-sizing: border-box; 
    overflow: hidden; 
  }
  @media (min-width: 768px) { .card { padding: 40px; } }

  /* BẢNG MENU CHÍNH (Tàng hình lộ ảnh nền) */
  #menuView { 
    background: transparent; 
    box-shadow: none; 
    padding: 0; 
  }

  /* ========================================= */

  .hub-title { font-size: 28px; font-weight: 800; margin-bottom: 6px; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  .hub-sub { color: rgba(255, 255, 255, 0.9); margin-bottom: 24px; font-size: 16px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .module-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 600px) { .module-grid { grid-template-columns: repeat(2, 1fr); } }

  .module-btn { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 16px; padding: 22px; cursor: pointer; text-align: left; transition: all 0.2s; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .module-btn:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.25); }
  .m-title { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .m-desc { font-size: 14px; color: rgba(255, 255, 255, 0.85); line-height: 1.4; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

  .q-stats { font-size: 13px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
  .q-text { font-size: 20px; font-weight: 600; margin-bottom: 24px; line-height: 1.45; }

  /* NÚT ĐÁP ÁN (Tối ưu chống tràn chữ) */
  .opt-btn { 
    width: 100%; 
    background: var(--bg-color); 
    border: 2px solid transparent; 
    border-radius: 16px; 
    padding: 16px; 
    margin-bottom: 12px; 
    text-align: left; 
    font-size: 16px; 
    font-weight: 500; 
    color: var(--text-main); 
    cursor: pointer; 
    display: flex; 
    gap: 12px; 
    align-items: flex-start; 
    transition: all 0.2s ease; 
    user-select: none; 
    box-sizing: border-box; 
    word-break: break-word; /* Chữ dài tự động vỡ dòng, không làm phình khung */
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.98); }
  .opt-label { font-weight: 700; color: var(--accent); flex-shrink: 0; }
  
  .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: #0e5c22; }
  .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: #8a1510; }
  .opt-btn:disabled { cursor: default; opacity: 0.8; }
  .opt-btn.dimmed { opacity: 0.4; }

  .feedback { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 14.5px; font-weight: 500; display: none; line-height: 1.4; animation: fadeIn 0.3s ease; }
  .feedback.show { display: block; }
  .feedback.success { background: var(--success-bg); color: #0e5c22; border-left: 4px solid var(--success); }
  .feedback.error { background: var(--danger-bg); color: #8a1510; border-left: 4px solid var(--danger); }
  
  /* CSS LOADING SPINNER */
  .loader-spinner {
    border: 4px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px auto;
  }
  
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .hidden { display: none !important; }
  .text-center { text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">✈️ Internal Training</div>
  <button class="btn-header hidden" id="btnBack" onclick="goHome()">☰ Menu</button>
</div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

<!-- CONTAINER CHÍNH -->
<div class="container" id="mainContainer">
  
  <!-- MÀN HÌNH MENU -->
  <div id="menuView" class="card">
    <div class="hub-title">Training Modules</div>
    <div class="hub-sub">Please select a module to start.</div>
    <div class="module-grid" id="moduleList">
      <!-- Sẽ được load tự động qua JS -->
    </div>
  </div>

  <!-- MÀN HÌNH LOADING (Giao diện chờ) -->
  <div id="loadingView" class="card hidden text-center">
    <div class="loader-spinner"></div>
    <h3 style="font-size: 18px; color: var(--text-main);">Loading Module...</h3>
    <p style="color: var(--text-sub); font-size: 14px; margin-top: 4px;">Preparing questions, please wait.</p>
  </div>

  <!-- MÀN HÌNH BÀI LÀM QUIZ -->
  <div id="quizView" class="card hidden">
    <div class="q-stats" id="qStats">
      <span id="statProgress">Passed: 0/0</span>
      <span id="statAcc">Accuracy: 100%</span>
    </div>
    <div class="q-text" id="qText">Loading question...</div>
    <div id="optionsList"></div>
    <div class="feedback" id="feedbackBox"></div>
  </div>

  <!-- MÀN HÌNH HOÀN THÀNH KẾT QUẢ -->
  <div id="endView" class="card hidden text-center">
    <div style="font-size: 60px; margin-bottom: 10px;">🏆</div>
    <h2 style="font-size: 28px; margin-bottom: 8px;" id="endTitle">100% Completed!</h2>
    <p style="color: var(--text-sub); margin-bottom: 24px;" id="endDesc">Calculating score...</p>
    <button class="btn-header" style="background: var(--accent); color: white; padding: 14px 24px; font-size: 16px;" onclick="goHome()">Back to Home</button>
  </div>

</div>

<script>
// --- ADVANCED STATE MANAGEMENT ---
let originalQuizData = []; 
let currentRoundData = []; 
let nextRoundData = [];    

let globalTotal = 0;       
let globalCompleted = 0;   
let currentRoundIndex = 0; 
let totalAttempts = 0;     
let totalCorrectAttempts = 0; 
let advanceTimer;

// TỐI ƯU TỐC ĐỘ: Khai báo thẳng danh sách Module, bỏ Fetch file modules.json
const localModules = [
  {
    "id": "m07a",
    "title": "Module 7A: Maintenance Practices",
    "desc": "Basic Training for Aircraft Maintenance Technician",
    "file": "data/m07a.json"
  },
  {
    "id": "m07a209",
    "title": "Module 7A: Maintenance Practices (209)",
    "desc": "Basic Training for Aircraft Maintenance Technician (Part 209)",
    "file": "data/m07a209.json"
  }
];

function init() {
  let html = '';
  localModules.forEach(m => {
    html += `
      <button class="module-btn" onclick="startQuiz('${m.file}')">
        <div class="m-title">${m.title}</div>
        <div class="m-desc">${m.desc}</div>
      </button>`;
  });
  document.getElementById('moduleList').innerHTML = html;
}

async function startQuiz(fileUrl) {
  // 1. CHUYỂN SANG MÀN HÌNH LOADING NGAY LẬP TỨC
  document.getElementById('menuView').classList.add('hidden');
  document.getElementById('endView').classList.add('hidden');
  document.getElementById('quizView').classList.add('hidden');
  
  document.getElementById('loadingView').classList.remove('hidden');
  document.getElementById('btnBack').classList.remove('hidden');
  
  // BẬT CHẾ ĐỘ CĂN GIỮA
  document.getElementById('mainContainer').classList.add('center-mode');

  try {
    // 2. FETCH DỮ LIỆU
    const res = await fetch(fileUrl);
    if (!res.ok) throw new Error("Failed to load");
    originalQuizData = await res.json();
    
    // 3. SET UP DATA
    currentRoundData = [...originalQuizData];
    nextRoundData = [];
    globalTotal = originalQuizData.length;
    globalCompleted = 0;
    currentRoundIndex = 0;
    totalAttempts = 0;
    totalCorrectAttempts = 0;
    
    // 4. ẨN LOADING VÀ HIỆN QUIZ
    document.getElementById('loadingView').classList.add('hidden');
    document.getElementById('quizView').classList.remove('hidden');
    
    renderQuestion();
  } catch (error) {
    document.getElementById('loadingView').innerHTML = `
      <div style="font-size: 40px; margin-bottom: 10px;">⚠️</div>
      <h3 style="color: var(--danger);">Load Failed!</h3>
      <p style="color: var(--text-sub); margin-top: 5px;">Cannot find <b>${fileUrl}</b>.<br>Please check network or data file.</p>
    `;
  }
}

function renderQuestion() {
  if (currentRoundIndex >= currentRoundData.length) {
    if (nextRoundData.length === 0) {
      showEndScreen();
    } else {
      document.getElementById('qStats').style.display = 'none';
      document.getElementById('qText').innerHTML = `<span style="color:var(--accent)">🔄 Reviewing ${nextRoundData.length} incorrect question(s)...</span>`;
      document.getElementById('optionsList').innerHTML = '';
      document.getElementById('feedbackBox').className = 'feedback';
      
      currentRoundData = [...nextRoundData];
      nextRoundData = [];
      currentRoundIndex = 0;
      
      setTimeout(() => {
        document.getElementById('qStats').style.display = 'flex';
        renderQuestion();
      }, 2000);
    }
    return;
  }

  const q = currentRoundData[currentRoundIndex];
  const accuracy = totalAttempts === 0 ? 100 : Math.round((totalCorrectAttempts / totalAttempts) * 100);
  document.getElementById('statProgress').innerText = `Passed: ${globalCompleted}/${globalTotal}`;
  document.getElementById('statAcc').innerText = `Accuracy: ${accuracy}%`;
  
  document.getElementById('progressBar').style.width = ((globalCompleted) / globalTotal * 100) + '%';
  document.getElementById('qText').innerText = q[1];
  document.getElementById('feedbackBox').className = 'feedback'; 
  
  let optsHtml = '';
  q[2].forEach((optText, i) => {
    const label = ['A', 'B', 'C', 'D'][i];
    optsHtml += `
      <button class="opt-btn" onclick="checkAnswer(${i}, ${q[3]}, this, '${q[4] || ''}')">
        <span class="opt-label">${label}.</span>
        <span style="flex: 1;">${optText}</span>
      </button>`;
  });
  document.getElementById('optionsList').innerHTML = optsHtml;
}

function checkAnswer(selectedIndex, correctIndex, btnClicked, explanation) {
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true); 

  const isCorrect = (selectedIndex === correctIndex);
  const feedbackBox = document.getElementById('feedbackBox');
  
  totalAttempts++;

  if (isCorrect) {
    totalCorrectAttempts++;
    globalCompleted++; 
    
    btnClicked.classList.add('correct');
    feedbackBox.innerText = "✓ Correct!";
    feedbackBox.className = 'feedback show success';
    allBtns.forEach((b, i) => { if(i !== selectedIndex) b.classList.add('dimmed'); });
  } else {
    nextRoundData.push(currentRoundData[currentRoundIndex]);
    
    btnClicked.classList.add('wrong');
    allBtns[correctIndex].classList.add('correct'); 
    feedbackBox.innerHTML = `<strong>✗ Incorrect!</strong><br><span style="font-size:13.5px; opacity: 0.9; display:block; margin-top:4px;">${explanation}</span>`;
    feedbackBox.className = 'feedback show error';
    allBtns.forEach((b, i) => { if(i !== selectedIndex && i !== correctIndex) b.classList.add('dimmed'); });
  }

  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => {
    currentRoundIndex++;
    renderQuestion();
  }, 1500);
}

function showEndScreen() {
  document.getElementById('quizView').classList.add('hidden');
  document.getElementById('endView').classList.remove('hidden');
  document.getElementById('btnBack').classList.add('hidden');
  document.getElementById('progressBar').style.width = '100%';
  
  const finalAcc = Math.round((totalCorrectAttempts / totalAttempts) * 100);
  document.getElementById('endDesc').innerHTML = `Final Accuracy: <strong>${finalAcc}%</strong><br>Total attempts: ${totalAttempts}`;
}

function goHome() {
  clearTimeout(advanceTimer);
  document.getElementById('quizView').classList.add('hidden');
  document.getElementById('endView').classList.add('hidden');
  document.getElementById('loadingView').classList.add('hidden'); // Fix lỡ tay back lúc loading
  document.getElementById('menuView').classList.remove('hidden');
  document.getElementById('btnBack').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  
  // TẮT CHẾ ĐỘ CĂN GIỮA ĐỂ MENU NẰM Ở LỀ TRÊN
  document.getElementById('mainContainer').classList.remove('center-mode');
}

// Khởi chạy
init();
</script>
</body>
</html>
