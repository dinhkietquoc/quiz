<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Internal Training</title>

<link rel="preload" as="image" href="bg.jpg">

<style>
  :root { 
    --bg-color: #f5f5f7; 
    --card-bg: #ffffff; 
    --text-main: #1d1d1f; 
    --text-sub: #86868b; 
    --accent: #007aff; 
    --success: #34c759; 
    --success-bg: #e8f9ec; 
    --danger: #ff3b30; 
    --danger-bg: #ffecec; 
    --border: #e5e5ea; 
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background-color: #d1d1d6; 
    background-image: url('bg.jpg'); 
    background-size: cover; 
    background-position: center; 
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text-main); 
    font-family: -apple-system, BlinkMacSystemFont, "Roboto", sans-serif; 
    line-height: 1.5; 
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }

  .topbar { position: sticky; top: 0; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
  .brand { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .btn-header { background: var(--bg-color); color: var(--accent); border: none; padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .btn-header:active { transform: scale(0.95); }
  
  /* MENU XỔ XUỐNG */
  .menu-wrapper { position: relative; }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 220px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    border: 1px solid var(--border);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 200;
    animation: fadeIn 0.2s ease;
  }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .dropdown-item:hover, .dropdown-item:active { background: var(--bg-color); }
  .dropdown-item.dev { color: #4f46e5; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px; }

  /* BẢNG ĐĂNG NHẬP (CHỈ HIỆN KHI BẤM NÚT) */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }
  .modal-box {
    background: white;
    width: 100%;
    max-width: 350px;
    border-radius: 24px;
    padding: 26px 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }
  .modal-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 4px; color: var(--text-main); }
  .modal-sub { font-size: 13px; color: var(--text-sub); text-align: center; margin-bottom: 18px; }
  .input-field {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }
  .input-field:focus { border-color: var(--accent); }
  .btn-login {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-close-modal {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 13px;
    margin-top: 10px;
    cursor: pointer;
    padding: 6px;
  }
  .error-msg { color: var(--danger); font-size: 12px; margin-bottom: 10px; display: none; text-align: center; font-weight: 500; }

  .progress-container { width: 100%; height: 4px; background: var(--border); }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

  .container { 
    flex: 1; 
    width: 100%; 
    max-width: 650px; 
    margin: 0 auto; 
    padding: 30px 5%; 
    box-sizing: border-box; 
    display: flex; 
    flex-direction: column;
    justify-content: flex-start;
    transition: all 0.3s ease;
  }

  .container.center-mode {
    justify-content: center;
    align-items: center;
    padding-top: 15px;
    padding-bottom: 15px;
  }

  .card { 
    background: rgba(255, 255, 255, 0.95); 
    border-radius: 24px; 
    padding: 24px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
    border: none; 
    width: 100%; 
    box-sizing: border-box; 
    overflow: hidden; 
  }
  @media (min-width: 768px) { .card { padding: 40px; } }

  #menuView { background: transparent; box-shadow: none; padding: 0; }

  .hub-title { font-size: 28px; font-weight: 800; margin-bottom: 6px; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  .hub-sub { color: rgba(255, 255, 255, 0.9); margin-bottom: 24px; font-size: 16px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .module-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 600px) { .module-grid { grid-template-columns: repeat(2, 1fr); } }

  .module-btn { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 16px; padding: 22px; cursor: pointer; text-align: left; transition: all 0.2s; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .module-btn:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.25); }
  .m-title { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .m-desc { font-size: 14px; color: rgba(255, 255, 255, 0.85); line-height: 1.4; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

  .q-stats { font-size: 13px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
  .q-text { font-size: 20px; font-weight: 600; margin-bottom: 24px; line-height: 1.45; }

  .opt-btn { 
    width: 100%; 
    background: var(--bg-color); 
    border: 2px solid transparent; 
    border-radius: 16px; 
    padding: 16px; 
    margin-bottom: 12px; 
    text-align: left; 
    font-size: 16px; 
    font-weight: 500; 
    color: var(--text-main); 
    cursor: pointer; 
    display: flex; 
    gap: 12px; 
    align-items: flex-start; 
    transition: all 0.2s ease; 
    user-select: none; 
    box-sizing: border-box; 
    word-break: break-word; 
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.98); }
  .opt-label { font-weight: 700; color: var(--accent); flex-shrink: 0; }
  
  .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: #0e5c22; }
  .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: #8a1510; }
  .opt-btn:disabled { cursor: default; opacity: 0.8; }
  .opt-btn.dimmed { opacity: 0.4; }

  .feedback { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 14.5px; font-weight: 500; display: none; line-height: 1.4; animation: fadeIn 0.3s ease; }
  .feedback.show { display: block; }
  .feedback.success { background: var(--success-bg); color: #0e5c22; border-left: 4px solid var(--success); }
  .feedback.error { background: var(--danger-bg); color: #8a1510; border-left: 4px solid var(--danger); }
  
  .loader-spinner {
    border: 4px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px auto;
  }
  
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .hidden { display: none !important; }
  .text-center { text-align: center; }
</style>
</head>
<body>

<!-- THANH HEADER -->
<div class="topbar">
  <div class="brand">✈️ Internal Training</div>
  <div class="menu-wrapper">
    <button class="btn-header" id="btnMenu" onclick="toggleMenu(event)">☰ Menu</button>
    <div id="dropdownMenu" class="dropdown-menu hidden">
      <button class="dropdown-item" onclick="handleMenuHome()">
        <span>🏠</span> Về trang chủ
      </button>
      <button class="dropdown-item dev" onclick="openDevLoginModal()">
        <span>🛠️</span> Cho nhà phát triển
      </button>
    </div>
  </div>
</div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

<!-- POPUP ĐĂNG NHẬP ADMIN (CHỈ MỞ KHI BẤM NÚT CHO NHÀ PHÁT TRIỂN) -->
<div id="loginModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title">🔐 Quản Trị Viên</div>
    <div class="modal-sub">Dành cho Nhà phát triển</div>
    
    <form onsubmit="handleAdminLogin(event)">
      <input type="text" id="adminUser" placeholder="Tên tài khoản" class="input-field" required autocomplete="username" />
      <input type="password" id="adminPass" placeholder="Mật khẩu" class="input-field" required autocomplete="current-password" />
      
      <div id="loginError" class="error-msg">Sai tài khoản hoặc mật khẩu!</div>
      
      <button type="submit" class="btn-login">Đăng nhập</button>
      <button type="button" class="btn-close-modal" onclick="closeDevLoginModal()">Đóng</button>
    </form>
  </div>
</div>

<!-- KHUNG LÀM BÀI BÌNH THƯỜNG -->
<div class="container" id="mainContainer">
  
  <div id="menuView" class="card">
    <div class="hub-title">Training Modules</div>
    <div class="hub-sub">Please select a module to start.</div>
    <div class="module-grid" id="moduleList">
      <div class="loader-spinner" style="margin-top: 20px;"></div>
    </div>
  </div>

  <div id="loadingView" class="card hidden text-center">
    <div class="loader-spinner"></div>
    <h3 style="font-size: 18px; color: var(--text-main);">Loading Module...</h3>
    <p style="color: var(--text-sub); font-size: 14px; margin-top: 4px;">Preparing questions, please wait.</p>
  </div>

  <div id="quizView" class="card hidden">
    <div class="q-stats" id="qStats">
      <span id="statProgress">Passed: 0/0</span>
      <span id="statAcc">Accuracy: 100%</span>
    </div>
    <div class="q-text" id="qText">Loading question...</div>
    <div id="optionsList"></div>
    <div class="feedback" id="feedbackBox"></div>
  </div>

  <div id="endView" class="card hidden text-center">
    <div style="font-size: 60px; margin-bottom: 10px;">🏆</div>
    <h2 style="font-size: 28px; margin-bottom: 8px;" id="endTitle">100% Completed!</h2>
    <p style="color: var(--text-sub); margin-bottom: 24px;" id="endDesc">Calculating score...</p>
    <button class="btn-header" style="background: var(--accent); color: white; padding: 14px 24px; font-size: 16px;" onclick="goHome()">Back to Home</button>
  </div>

</div>

<script>
let originalQuizData = []; 
let currentRoundData = []; 
let nextRoundData = [];    

let globalTotal = 0;       
let globalCompleted = 0;   
let currentRoundIndex = 0; 
let totalAttempts = 0;     
let totalCorrectAttempts = 0; 
let advanceTimer;

async function init() {
  try {
    const res = await fetch('data/modules.json');
    if (!res.ok) throw new Error("Không thể tải modules.json");
    
    const modules = await res.json();
    let html = '';
    
    modules.forEach(m => {
      html += `
        <button class="module-btn" onclick="startQuiz('${m.file}')">
          <div class="m-title">${m.title}</div>
          <div class="m-desc">${m.desc}</div>
        </button>`;
    });
    document.getElementById('moduleList').innerHTML = html;
  } catch (error) {
    document.getElementById('moduleList').innerHTML = '<p style="color:red; text-align:center; padding: 20px;">⚠️ Lỗi tải danh sách Module. Vui lòng kiểm tra lại file data/modules.json!</p>';
    console.error(error);
  }
}

async function startQuiz(fileUrl) {
  document.getElementById('menuView').classList.add('hidden');
  document.getElementById('endView').classList.add('hidden');
  document.getElementById('quizView').classList.add('hidden');
  
  document.getElementById('loadingView').classList.remove('hidden');
  document.getElementById('mainContainer').classList.add('center-mode');

  try {
    const res = await fetch(fileUrl);
    if (!res.ok) throw new Error("Failed to load");
    originalQuizData = await res.json();
    
    currentRoundData = [...originalQuizData];
    nextRoundData = [];
    globalTotal = originalQuizData.length;
    globalCompleted = 0;
    currentRoundIndex = 0;
    totalAttempts = 0;
    totalCorrectAttempts = 0;
    
    document.getElementById('loadingView').classList.add('hidden');
    document.getElementById('quizView').classList.remove('hidden');
    
    renderQuestion();
  } catch (error) {
    document.getElementById('loadingView').innerHTML = `
      <div style="font-size: 40px; margin-bottom: 10px;">⚠️</div>
      <h3 style="color: var(--danger);">Load Failed!</h3>
      <p style="color: var(--text-sub); margin-top: 5px;">Cannot find <b>${fileUrl}</b>.<br>Please check network or data file.</p>
    `;
  }
}

function renderQuestion() {
  if (currentRoundIndex >= currentRoundData.length) {
    if (nextRoundData.length === 0) {
      showEndScreen();
    } else {
      document.getElementById('qStats').style.display = 'none';
      document.getElementById('qText').innerHTML = `<span style="color:var(--accent)">🔄 Reviewing ${nextRoundData.length} incorrect question(s)...</span>`;
      document.getElementById('optionsList').innerHTML = '';
      document.getElementById('feedbackBox').className = 'feedback';
      
      currentRoundData = [...nextRoundData];
      nextRoundData = [];
      currentRoundIndex = 0;
      
      setTimeout(() => {
        document.getElementById('qStats').style.display = 'flex';
        renderQuestion();
      }, 2000);
    }
    return;
  }

  const q = currentRoundData[currentRoundIndex];
  const accuracy = totalAttempts === 0 ? 100 : Math.round((totalCorrectAttempts / totalAttempts) * 100);
  document.getElementById('statProgress').innerText = `Passed: ${globalCompleted}/${globalTotal}`;
  document.getElementById('statAcc').innerText = `Accuracy: ${accuracy}%`;
  
  document.getElementById('progressBar').style.width = ((globalCompleted) / globalTotal * 100) + '%';
  document.getElementById('qText').innerText = q[1];
  document.getElementById('feedbackBox').className = 'feedback'; 
  
  let optsHtml = '';
  q[2].forEach((optText, i) => {
    const label = ['A', 'B', 'C', 'D'][i];
    optsHtml += `
      <button class="opt-btn" onclick="checkAnswer(${i}, ${q[3]}, this, '${q[4] || ''}')">
        <span class="opt-label">${label}.</span>
        <span style="flex: 1;">${optText}</span>
      </button>`;
  });
  document.getElementById('optionsList').innerHTML = optsHtml;
}

function checkAnswer(selectedIndex, correctIndex, btnClicked, explanation) {
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true); 

  const isCorrect = (selectedIndex === correctIndex);
  const feedbackBox = document.getElementById('feedbackBox');
  
  totalAttempts++;

  if (isCorrect) {
    totalCorrectAttempts++;
    globalCompleted++; 
    
    btnClicked.classList.add('correct');
    feedbackBox.innerText = "✓ Correct!";
    feedbackBox.className = 'feedback show success';
    allBtns.forEach((b, i) => { if(i !== selectedIndex) b.classList.add('dimmed'); });
  } else {
    nextRoundData.push(currentRoundData[currentRoundIndex]);
    
    btnClicked.classList.add('wrong');
    allBtns[correctIndex].classList.add('correct'); 
    feedbackBox.innerHTML = `<strong>✗ Incorrect!</strong><br><span style="font-size:13.5px; opacity: 0.9; display:block; margin-top:4px;">${explanation}</span>`;
    feedbackBox.className = 'feedback show error';
    allBtns.forEach((b, i) => { if(i !== selectedIndex && i !== correctIndex) b.classList.add('dimmed'); });
  }

  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => {
    currentRoundIndex++;
    renderQuestion();
  }, 1500);
}

function showEndScreen() {
  document.getElementById('quizView').classList.add('hidden');
  document.getElementById('endView').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '100%';
  
  const finalAcc = Math.round((totalCorrectAttempts / totalAttempts) * 100);
  document.getElementById('endDesc').innerHTML = `Final Accuracy: <strong>${finalAcc}%</strong><br>Total attempts: ${totalAttempts}`;
}

function goHome() {
  clearTimeout(advanceTimer);
  document.getElementById('quizView').classList.add('hidden');
  document.getElementById('endView').classList.add('hidden');
  document.getElementById('loadingView').classList.add('hidden');
  document.getElementById('menuView').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  
  document.getElementById('mainContainer').classList.remove('center-mode');
  init();
}

// XỬ LÝ MENU & ĐĂNG NHẬP ADMIN
function toggleMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('dropdownMenu');
  menu.classList.toggle('hidden');
}

document.addEventListener('click', (e) => {
  const menu = document.getElementById('dropdownMenu');
  const btn = document.getElementById('btnMenu');
  if (menu && !menu.contains(e.target) && e.target !== btn) {
    menu.classList.add('hidden');
  }
});

function handleMenuHome() {
  document.getElementById('dropdownMenu').classList.add('hidden');
  goHome();
}

function openDevLoginModal() {
  document.getElementById('dropdownMenu').classList.add('hidden');
  document.getElementById('loginModal').classList.remove('hidden');
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('adminUser').value = '';
  document.getElementById('adminPass').value = '';
}

function closeDevLoginModal() {
  document.getElementById('loginModal').classList.add('hidden');
}

const VALID_ACCOUNTS = {
  "admin": "admin123",
  "quockiet": "adminquockiet"
};

function handleAdminLogin(e) {
  e.preventDefault();
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value.trim();
  const errorBox = document.getElementById('loginError');

  if (VALID_ACCOUNTS[u] && VALID_ACCOUNTS[u] === p) {
    sessionStorage.setItem("isAdmin", "true");
    sessionStorage.setItem("adminUser", u);
    window.location.href = "admin.html";
  } else {
    errorBox.style.display = 'block';
  }
}

init();
</script>
</body>
</html>
