<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Cấu hình viewport chuẩn cho Mobile: Không cho zoom để tránh lag khi chạm -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aviation Training Hub</title>
<style>
  /* KHAI BÁO BIẾN MÀU SẮC CHUẨN (Sáng sủa, hiện đại) */
  :root {
    --bg-color: #f5f5f7;
    --card-bg: #ffffff;
    --text-main: #1d1d1f;
    --text-sub: #86868b;
    --accent: #007aff;
    --accent-hover: #005bb5;
    --success: #34c759;
    --success-bg: #e8f9ec;
    --danger: #ff3b30;
    --danger-bg: #ffecec;
    --border: #e5e5ea;
  }

  /* RESET & BASE - Tối ưu font chữ cho từng hệ điều hành */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-color);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
    line-height: 1.5;
    /* Tối ưu tai thỏ iPhone */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* THANH ĐIỀU HƯỚNG (TOPBAR) - Kính mờ Glassmorphism */
  .topbar {
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
  }
  .brand { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  
  .btn-header {
    background: var(--bg-color);
    color: var(--accent);
    border: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  @media (hover: hover) { .btn-header:hover { background: #e8e8ed; } }
  .btn-header:active { transform: scale(0.95); }
  
  /* THANH TIẾN ĐỘ */
  .progress-container { width: 100%; height: 4px; background: var(--border); }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

  /* BỐ CỤC CHÍNH (PC & MOBILE) */
  .container { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 24px 16px 40px; }
  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }
  @media (min-width: 768px) {
    .card { padding: 40px; } /* PC rộng rãi hơn */
  }

  /* MÀN HÌNH 1: MENU CHỌN ĐỀ (Dạng Grid cho PC) */
  .hub-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .hub-sub { color: var(--text-sub); margin-bottom: 24px; font-size: 15px; }
  .module-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 600px) {
    .module-grid { grid-template-columns: repeat(2, 1fr); } /* 2 cột trên PC/Tablet */
  }
  .module-btn {
    background: var(--bg-color);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }
  @media (hover: hover) { .module-btn:hover { border-color: var(--accent); background: #f0f4ff; } }
  .module-btn:active { transform: scale(0.98); }
  .m-title { font-size: 17px; font-weight: 700; color: var(--text-main); }
  .m-desc { font-size: 13px; color: var(--text-sub); margin-top: 6px; }

  /* MÀN HÌNH 2: LÀM BÀI TRẮC NGHIỆM */
  .q-stats { font-size: 13px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
  .q-text { font-size: 20px; font-weight: 600; margin-bottom: 24px; line-height: 1.45; }
  
  /* Nút đáp án tối ưu chạm ngón tay */
  .opt-btn {
    width: 100%;
    background: var(--bg-color);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    text-align: left;
    font-size: 16px;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: all 0.2s ease;
    user-select: none; /* Tránh bôi đen chữ khi chạm 2 lần trên điện thoại */
  }
  @media (hover: hover) { .opt-btn:hover:not(:disabled) { background: #ebebee; } }
  .opt-btn:active:not(:disabled) { transform: scale(0.98); }
  
  .opt-label { font-weight: 700; color: var(--accent); }
  
  /* Trạng thái đúng/sai */
  .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: #0e5c22; }
  .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: #8a1510; }
  .opt-btn:disabled { cursor: default; opacity: 0.8; }
  .opt-btn.dimmed { opacity: 0.4; }

  /* Vùng giải thích */
  .feedback { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 14.5px; font-weight: 500; display: none; line-height: 1.4; animation: fadeIn 0.3s ease; }
  .feedback.show { display: block; }
  .feedback.success { background: var(--success-bg); color: #0e5c22; border-left: 4px solid var(--success); }
  .feedback.error { background: var(--danger-bg); color: #8a1510; border-left: 4px solid var(--danger); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .hidden { display: none !important; }
  .text-center { text-align: center; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">✈️ Aviation Hub</div>
  <button class="btn-header hidden" id="btnBack" onclick="goHome()">☰ Menu</button>
</div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

<!-- MAIN CONTENT -->
<div class="container">
  
  <!-- Giao diện 1: Menu Đề Thi -->
  <div id="menuView" class="card">
    <div class="hub-title">Danh Mục Ôn Tập</div>
    <div class="hub-sub">Giao diện tương thích PC, iOS & Android</div>
    <div class="module-grid" id="moduleList">
      <p style="color: #888;">Đang tải dữ liệu...</p>
    </div>
  </div>

  <!-- Giao diện 2: Khu vực làm bài -->
  <div id="quizView" class="card hidden">
    <div class="q-stats" id="qStats">Câu 1 / 10</div>
    <div class="q-text" id="qText">Nội dung câu hỏi...</div>
    <div id="optionsList"></div>
    <div class="feedback" id="feedbackBox"></div>
  </div>

  <!-- Giao diện 3: Kết thúc -->
  <div id="endView" class="card hidden text-center">
    <div style="font-size: 60px; margin-bottom: 10px;">🏆</div>
    <h2 style="font-size: 28px; margin-bottom: 8px;" id="endTitle">Hoàn thành!</h2>
    <p style="color: var(--text-sub); margin-bottom: 24px;" id="endDesc">Bạn đã trả lời đúng X/Y câu hỏi.</p>
    <button class="btn-header" style="background: var(--accent); color: white; padding: 14px 24px; font-size: 16px;" onclick="goHome()">Quay về Trang Chủ</button>
  </div>

</div>

<script>
// --- STATE MANAGEMENT ---
let quizData = [];
let currentIndex = 0;
let correctCount = 0;
let advanceTimer;

// --- KHỞI TẠO MENU ---
async function init() {
  try {
    const res = await fetch('data/modules.json');
    const modules = await res.json();
    let html = '';
    modules.forEach(m => {
      html += `
        <button class="module-btn" onclick="startQuiz('${m.file}')">
          <div class="m-title">${m.title}</div>
          <div class="m-desc">${m.desc}</div>
        </button>`;
    });
    document.getElementById('moduleList').innerHTML = html;
  } catch (error) {
    document.getElementById('moduleList').innerHTML = '<p style="color:red">Lỗi tải dữ liệu. Hãy chắc chắn bạn đã tạo file data/modules.json</p>';
  }
}

// --- BẮT ĐẦU LÀM BÀI ---
async function startQuiz(fileUrl) {
  try {
    const res = await fetch(fileUrl);
    quizData = await res.json(); // Nạp mảng tối ưu [id, text, [opts], ans_index, ref]
    currentIndex = 0;
    correctCount = 0;
    
    document.getElementById('menuView').classList.add('hidden');
    document.getElementById('endView').classList.add('hidden');
    document.getElementById('quizView').classList.remove('hidden');
    document.getElementById('btnBack').classList.remove('hidden');
    
    renderQuestion();
  } catch (error) {
    alert("Không tìm thấy file câu hỏi: " + fileUrl);
  }
}

// --- RENDER CÂU HỎI ---
function renderQuestion() {
  if (currentIndex >= quizData.length) {
    showEndScreen();
    return;
  }

  const q = quizData[currentIndex];
  // Cập nhật thống kê & thanh tiến độ
  document.getElementById('qStats').innerText = `Câu ${currentIndex + 1} / ${quizData.length}`;
  document.getElementById('progressBar').style.width = ((currentIndex) / quizData.length * 100) + '%';
  
  // Render nội dung
  document.getElementById('qText').innerText = q[1];
  document.getElementById('feedbackBox').className = 'feedback'; // Ẩn giải thích
  
  // Render đáp án
  let optsHtml = '';
  q[2].forEach((optText, i) => {
    const label = ['A', 'B', 'C', 'D'][i];
    optsHtml += `
      <button class="opt-btn" onclick="checkAnswer(${i}, ${q[3]}, this, '${q[4] || ''}')">
        <span class="opt-label">${label}.</span>
        <span style="flex: 1;">${optText}</span>
      </button>`;
  });
  document.getElementById('optionsList').innerHTML = optsHtml;
}

// --- KIỂM TRA ĐÚNG/SAI ---
function checkAnswer(selectedIndex, correctIndex, btnClicked, explanation) {
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true); // Khóa toàn bộ nút

  const isCorrect = (selectedIndex === correctIndex);
  const feedbackBox = document.getElementById('feedbackBox');

  if (isCorrect) {
    correctCount++;
    btnClicked.classList.add('correct');
    feedbackBox.innerText = "✓ Chính xác!";
    feedbackBox.className = 'feedback show success';
    
    // Tự làm mờ các nút khác
    allBtns.forEach((b, i) => { if(i !== selectedIndex) b.classList.add('dimmed'); });
  } else {
    btnClicked.classList.add('wrong');
    allBtns[correctIndex].classList.add('correct'); // Hiện đáp án đúng
    
    // Hiện giải thích
    feedbackBox.innerHTML = `<strong>✗ Sai rồi!</strong><br><span style="font-size:13.5px; opacity: 0.9; display:block; margin-top:4px;">${explanation}</span>`;
    feedbackBox.className = 'feedback show error';
    
    // Làm mờ các nút không liên quan
    allBtns.forEach((b, i) => { if(i !== selectedIndex && i !== correctIndex) b.classList.add('dimmed'); });
  }

  // Tự chuyển câu sau 1.2 giây
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => {
    currentIndex++;
    renderQuestion();
  }, 1200);
}

// --- KẾT THÚC BÀI THI ---
function showEndScreen() {
  document.getElementById('quizView').classList.add('hidden');
  document.getElementById('endView').classList.remove('hidden');
  document.getElementById('btnBack').classList.add('hidden');
  document.getElementById('progressBar').style.width = '100%';
  
  const pct = Math.round((correctCount / quizData.length) * 100);
  document.getElementById('endTitle').innerText = pct === 100 ? 'Xuất sắc!' : 'Hoàn thành';
  document.getElementById('endDesc').innerHTML = `Bạn đạt <strong>${correctCount}/${quizData.length}</strong> câu (${pct}%)`;
}

// --- QUAY LẠI MENU ---
function goHome() {
  clearTimeout(advanceTimer);
  document.getElementById('quizView').classList.add('hidden');
  document.getElementById('endView').classList.add('hidden');
  document.getElementById('menuView').classList.remove('hidden');
  document.getElementById('btnBack').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  init();
}

// Bật app
init();
</script>
</body>
</html>
